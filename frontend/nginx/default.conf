# ---------------------------------------------------------------------------
# Production web server for the OutreachOS dashboard.
#
# Serves the built SPA and proxies API traffic to the Django container so the
# browser only ever talks to one origin.
# ---------------------------------------------------------------------------
upstream outreachos_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable, content-hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # API + Django admin pass through to the backend service
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://outreachos_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — every route renders the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
